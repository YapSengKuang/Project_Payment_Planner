name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:build-config
      - run: python3 scripts/check_reference_projects.py
      - run: npx supabase start
      - name: Configure local test environment
        run: node scripts/configure-local.mjs
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop
